<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ShiftCheck - Employee Checkout</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Local styles -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-light">
  <div id="userControlsContainer"></div>
  <!-- PIN‑entry pane -->
  <div class="container py-5" id="loginPane">
    <h3 class="mb-3 text-center"><span class="business-name">ShiftCheck</span> - Employee Checkout</h3>
    <div class="card p-4 shadow-sm">
      <form onsubmit="login(); return false;">
        <label for="employeeSelect" class="form-label">Select Employee</label>
        <select id="employeeSelect" class="form-select mb-3" required>
          <option value="" disabled selected>Loading employees...</option>
        </select>
        <label for="pin" class="form-label">Enter PIN</label>
        <input
          type="password"
          id="pin"
          class="form-control mb-3"
          maxlength="6"
          required autofocus
        />
        <button type="submit" class="btn btn-primary w-100">Continue</button>
      </form>
    </div>
  </div>

  <!-- Task checklist pane -->
  <div class="container py-5 d-none" id="taskPane">
    <h4 id="welcome"></h4>
    <div id="tutorialAlertPlaceholder" class="mb-3"></div>

    <div class="card mb-4 shadow-sm">
      <div class="card-body">
        <h5 class="card-title text-center mb-3">Team Activity (Last 7 Days)</h5>
        <div style="position: relative; height: 200px; width: 100%;">
            <canvas id="employeeStatsChart"></canvas>
        </div>
        <div id="employeeStatsSpinner" class="text-center my-3" style="display:none;">
          <div class="spinner-border spinner-border-sm" role="status"><span class="visually-hidden">Loading...</span></div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-md-4">
        <h5>Categories</h5>
        <div id="categoryListContainer" class="list-group mb-3">
          <div class="text-center p-3 text-muted">Loading categories...</div>
        </div>
      </div>

      <div class="col-md-8">
        <h5 id="taskListHeader">Tasks</h5>
        <button class="btn btn-sm btn-outline-secondary mb-3 ms-2" id="refreshBtn" onclick="refreshData()" title="Refresh Tasks and Stats">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-clockwise" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/>
                <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/>
            </svg>
            Refresh
        </button>
        <button class="btn btn-success mb-3" id="checkoutBtnTop" onclick="checkout()" disabled>Log Completed Tasks</button>
        <div id="taskListContainer" class="list-group mb-4">
          <div class="text-center p-3 text-muted">Select a category to view tasks.</div>
        </div>
        <button class="btn btn-success" id="checkoutBtn" onclick="checkout()" disabled>Log Completed Tasks</button>
      </div>
    </div>

    <!-- Task Detail Modal for Comments -->
    <div class="modal fade" id="taskDetailModal" tabindex="-1" aria-labelledby="taskDetailModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTaskTitle">Task Details</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <h6>Description</h6>
            <p id="modalTaskDescription" class="text-muted small"></p>
            <hr>
            <h6>Comments</h6>
            <ul id="modalCommentList" class="list-unstyled mb-3" style="max-height: 200px; overflow-y: auto;">
              <li class="text-center text-muted" id="commentsLoading">Loading comments...</li>
            </ul>
            <div class="mb-3">
              <label for="newCommentText" class="form-label visually-hidden">Add Comment</label>
              <textarea class="form-control form-control-sm" id="newCommentText" rows="2" placeholder="Add a comment..."></textarea>
            </div>
            <div id="commentError" class="text-danger small mb-2 d-none"></div> </div>
          <div class="modal-footer justify-content-between">
            <button type="button" class="btn btn-info btn-sm d-none" id="markReadBtn" onclick="markCommentsRead()">Mark Comments As Read</button>
            <div>
              <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
              <button type="button" class="btn btn-primary btn-sm" id="addCommentBtn" onclick="addComment()">Add Comment</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Client‑side logic -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <footer class="text-center text-muted small mt-5 fixed-bottom pb-2"><a href="https://github.com/aprabh96/shiftcheck" class="text-muted">ShiftCheck</a>, open source</footer>
</body>
</html>
